# CI для мода AFTER DARK (каталог after-dark/).
# Проверяет исходный код и XML. Финальная проверка работы мода выполняется ТОЛЬКО в игре.
name: AFTER DARK CI

on:
  push:
    paths:
      - "after-dark/**"
      - ".github/workflows/after-dark-ci.yml"
  pull_request:
    paths:
      - "after-dark/**"
      - ".github/workflows/after-dark-ci.yml"

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: after-dark
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Repository validation (syntax, XML, strings, versions, forbidden files)
        run: python tools/validate_repo.py

      - name: Unit tests (game-independent logic)
        run: python -m pytest -q
